<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b32">
<meta name="description" content="A small PWA demo for testing Android Back navigation.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>BackFlow Demo</title>
<style>
:root{--green:#173b32;--green2:#245548;--mint:#e8f2ed;--bg:#f4f7f5;--ink:#172720;--muted:#68776f;--line:#e3eae5;--white:#fff;--shadow:0 18px 45px #173b3218}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:contain}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #8fc5aa;outline-offset:3px}.app{min-height:100dvh}.topbar{height:68px;background:var(--green);color:white;display:flex;align-items:center;gap:13px;padding:0 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #102c251c}.menu-btn{background:#ffffff18;color:white;border-radius:13px;width:42px;height:42px;font-size:23px;display:grid;place-items:center}.brand{font-weight:750;font-size:17px;letter-spacing:.2px}.brand small{display:block;font-weight:450;font-size:11px;opacity:.72;letter-spacing:1.2px;text-transform:uppercase}.main{padding:22px 17px 36px;max-width:720px;margin:auto}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--green2);font-weight:800}.welcome{background:linear-gradient(135deg,#173b32,#2e6652);color:white;border-radius:24px;padding:25px 22px;margin-bottom:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:160px;height:160px;border:1px solid #ffffff26;border-radius:50%;right:-50px;top:-40px;box-shadow:0 0 0 22px #ffffff08,0 0 0 45px #ffffff05}.welcome .eyebrow{color:#b9d7c7}.welcome h1{font-size:27px;line-height:1.15;margin:9px 0}.welcome p{color:#e0eee6;margin:0;max-width:340px}.section-title{font-size:16px;font-weight:800;margin:22px 0 12px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile,.panel,.list-item{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 4px 16px #173b3207}.tile{min-height:125px;text-align:left;color:var(--ink);transition:transform .15s}.tile:active{transform:scale(.98)}.tile-icon{width:40px;height:40px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:20px;margin-bottom:12px}.tile strong{display:block;font-size:15px}.tile span:last-child{font-size:12px;color:var(--muted)}.hint{background:#fff9e9;border:1px solid #f2e5bd;border-radius:15px;padding:14px 15px;color:#6b5621;font-size:13px;margin-top:20px}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.page-heading h1{margin:4px 0 0;font-size:27px}.pill{background:var(--mint);color:var(--green);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:750;white-space:nowrap}.list-item{display:flex;align-items:center;gap:13px;margin-bottom:10px;width:100%;text-align:left}.avatar{width:46px;height:46px;border-radius:15px;background:#dcebe2;display:grid;place-items:center;color:var(--green);font-weight:800;font-size:16px;flex-shrink:0}.item-copy{flex:1}.item-copy strong{display:block}.item-copy small{color:var(--muted)}.chevron{font-size:23px;color:#809087}.back-link{background:transparent;color:var(--green);font-weight:750;padding:8px 0;margin-bottom:8px}.profile-card{text-align:center;padding:25px}.profile-avatar{width:88px;height:88px;margin:0 auto 12px;border-radius:28px;background:var(--mint);display:grid;place-items:center;font-size:29px;font-weight:800;color:var(--green)}.profile-card h2{margin:0 0 3px}.profile-card p{margin:0;color:var(--muted)}.details{text-align:left;margin-top:22px}.detail{padding:13px 0;border-bottom:1px solid var(--line)}.detail small{display:block;color:var(--muted);font-size:12px}.detail strong{display:block;margin-top:2px}.drawer-scrim{position:fixed;inset:0;background:#071d17a6;z-index:9;opacity:0;pointer-events:none;transition:opacity .22s}.drawer{position:fixed;z-index:10;left:0;top:0;bottom:0;width:min(82vw,320px);background:#fbfdfb;transform:translateX(-105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding:calc(22px + env(safe-area-inset-top)) 16px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column}.drawer-head{display:flex;align-items:center;gap:12px;padding:8px 8px 24px;border-bottom:1px solid var(--line);margin-bottom:14px}.logo{width:46px;height:46px;background:var(--green);color:white;border-radius:16px;display:grid;place-items:center;font-size:22px}.drawer-head strong{display:block}.drawer-head small{color:var(--muted)}.drawer-nav{display:grid;gap:5px}.drawer-nav button{padding:13px 12px;border-radius:13px;text-align:left;background:transparent;color:#42534a;font-weight:650;display:flex;gap:12px;align-items:center}.drawer-nav button.active{background:var(--mint);color:var(--green)}.drawer-nav span{width:24px;text-align:center;font-size:18px}.drawer-footer{margin-top:auto;padding:15px 10px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}body.drawer-open .drawer{transform:translateX(0)}body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:#172720;color:white;border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);width:max-content;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-note{font-size:12px;color:var(--muted);text-align:center;margin-top:25px}.primary{background:var(--green);color:white;padding:12px 16px;border-radius:13px;font-weight:750}.secondary{background:var(--mint);color:var(--green);padding:12px 16px;border-radius:13px;font-weight:750}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}@media(min-width:600px){.main{padding:30px 26px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.welcome{padding:32px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="menuButton" class="menu-btn" aria-label="Open navigation" aria-expanded="false">☰</button>
    <div class="brand">BackFlow <small>Android Back Demo</small></div>
  </header>
  <main id="main" class="main"></main>
</div>
<div id="scrim" class="drawer-scrim"></div>
<aside id="drawer" class="drawer" aria-label="Main navigation">
  <div class="drawer-head"><div class="logo">↶</div><div><strong>BackFlow Demo</strong><small>Test the Back button</small></div></div>
  <nav class="drawer-nav">
    <button data-page="dashboard"><span>⌂</span>Dashboard</button>
    <button data-page="students"><span>♙</span>Students</button>
    <button data-page="classes"><span>▦</span>Classes</button>
    <button data-page="settings"><span>⚙</span>Back test guide</button>
  </nav>
  <div class="drawer-footer">Demo only · No student data is stored</div>
</aside>
<div id="toast" class="toast" role="status"></div>
<script>
(() => {
  const main = document.getElementById('main');
  const menuButton = document.getElementById('menuButton');
  const scrim = document.getElementById('scrim');
  const toast = document.getElementById('toast');
  let toastTimer;
  let page = 'dashboard';
  let profileId = null;
  let drawerOpen = false;
  let ignoreNextPop = false;
  let exitArmed = false;
  let exitTimer;

  const students = [
    {id:'SD-001',name:'Meban Lyngdoh',klass:'Class IX',meta:'Class teacher demo'},
    {id:'SD-002',name:'Iaraplang Syiem',klass:'Class VIII',meta:'Class teacher demo'},
    {id:'SD-003',name:'Daphi Khongwir',klass:'Class X',meta:'Class teacher demo'}
  ];
  const pageTitles = {dashboard:'Dashboard',students:'Students',classes:'Classes',settings:'Back test guide',profile:'Student profile'};
  const state = () => ({backFlow:true,page,profileId,drawerOpen});
  function pushState(){ history.pushState(state(), '', location.pathname + location.search + location.hash); }
  function toastMsg(msg){ toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400); }
  function setDrawer(open, fromPop=false){
    if(open===drawerOpen) return;
    drawerOpen=open;
    document.body.classList.toggle('drawer-open',open);
    menuButton.setAttribute('aria-expanded',String(open));
    menuButton.textContent=open?'×':'☰';
    if(open && !fromPop) pushState();
  }
  function go(next, data={}){
    // If navigating from the drawer, replace its history entry with the
    // current page first. That prevents Back from reopening a stale drawer.
    if(drawerOpen){
      history.replaceState({backFlow:true,page,profileId,drawerOpen:false}, '', location.pathname + location.search + location.hash);
      setDrawer(false,true);
    }
    page=next;profileId=data.profileId||null;
    pushState(); render();
  }
  function backToPage(target){
    page=target;profileId=null;setDrawer(false,true);render();
  }
  function render(){
    document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    if(page==='dashboard'){
      main.innerHTML=`<section class="welcome"><div class="eyebrow">A tiny navigation experiment</div><h1>Back should feel natural.</h1><p>Try opening the menu, visiting a page, and pressing your phone's Android Back button.</p></section>
      <div class="section-title">Explore the demo</div><div class="tiles">
      <button class="tile" data-go="students"><span class="tile-icon">♙</span><strong>Students</strong><span>Open list → profile → back</span></button>
      <button class="tile" data-go="classes"><span class="tile-icon">▦</span><strong>Classes</strong><span>Try normal page navigation</span></button>
      <button class="tile" data-go="settings"><span class="tile-icon">↶</span><strong>Back test guide</strong><span>See what to test</span></button></div>
      <div class="hint"><strong>Quick test:</strong> Open the menu using ☰, then press Android Back. The menu should close without changing the page.</div>
      <div class="bottom-note">No login · No server · No personal data</div>`;
    } else if(page==='students'){
      main.innerHTML=`<div class="page-heading"><div><div class="eyebrow">Directory</div><h1>Students</h1></div><span class="pill">3 demo records</span></div>
      <p style="color:var(--muted);margin-top:-7px">Tap a student to open their profile, then press Android Back.</p>
      ${students.map(s=>`<button class="list-item" data-profile="${s.id}"><div class="avatar">${s.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div class="item-copy"><strong>${s.name}</strong><small>${s.id} · ${s.klass}</small></div><span class="chevron">›</span></button>`).join('')}
      <div class="bottom-note">These are fictional demo names.</div>`;
    } else if(page==='profile'){
      const s=students.find(x=>x.id===profileId)||students[0];
      main.innerHTML=`<button class="back-link" data-go="students">← Back to Students</button><section class="panel profile-card"><div class="profile-avatar">${s.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><h2>${s.name}</h2><p>${s.id}</p><div class="details"><div class="detail"><small>Class</small><strong>${s.klass}</strong></div><div class="detail"><small>Record type</small><strong>Sample profile</strong></div><div class="detail"><small>Stored data</small><strong>Demo only — nothing is saved</strong></div></div></section><div class="hint">Press your phone's Android Back button. You should return to the Students list.</div>`;
    } else if(page==='classes'){
      main.innerHTML=`<div class="page-heading"><div><div class="eyebrow">Academic</div><h1>Classes</h1></div><span class="pill">3 classes</span></div>
      ${[['Class VIII','Room 2'],['Class IX','Room 3'],['Class X','Room 4']].map(x=>`<div class="list-item"><div class="avatar">▦</div><div class="item-copy"><strong>${x[0]}</strong><small>${x[1]} · demo only</small></div></div>`).join('')}
      <div class="hint">Press Android Back to return to the page you visited before Classes.</div>`;
    } else {
      main.innerHTML=`<div class="page-heading"><div><div class="eyebrow">Test checklist</div><h1>Back test guide</h1></div></div><section class="panel"><div class="detail"><strong>1. Menu open</strong><small>Open ☰, press Android Back. Menu should close first.</small></div><div class="detail"><strong>2. Student profile</strong><small>Students → tap a name → Android Back returns to Students.</small></div><div class="detail"><strong>3. Page navigation</strong><small>Dashboard → Classes → Android Back returns to Dashboard.</small></div><div class="detail"><strong>4. Swipe menu</strong><small>Swipe inward from the left edge, then press Android Back.</small></div><div class="detail"><strong>5. Dashboard</strong><small>At Dashboard, Back asks for a second press to leave the demo.</small></div><div class="actions"><button class="primary" data-go="dashboard">Start testing</button></div></section><div class="hint">Important: a PWA runs inside the browser's navigation system. Android Back behavior can differ between Chrome, installed PWAs, and phone manufacturers.</div>`;
    }
  }
  menuButton.addEventListener('click',()=>{if(drawerOpen){history.back()}else{setDrawer(true)}});
  scrim.addEventListener('click',()=>{if(drawerOpen)history.back()});
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
  main.addEventListener('click',e=>{
    const p=e.target.closest('[data-profile]');
    if(p) { go('profile',{profileId:p.dataset.profile}); return; }
    const g=e.target.closest('[data-go]');
    if(g) go(g.dataset.go);
  });
  window.addEventListener('popstate',e=>{
    const s=e.state;
    if(s && s.backFlow){
      page=s.page||'dashboard';profileId=s.profileId||null;setDrawer(!!s.drawerOpen,true);render();exitArmed=false;
      return;
    }
    if(drawerOpen){setDrawer(false,true);render();return;}
    if(page!=='dashboard'){
      page='dashboard';profileId=null;render();pushState();return;
    }
    if(!exitArmed){
      exitArmed=true;toastMsg('Press Back again to leave the demo');clearTimeout(exitTimer);exitTimer=setTimeout(()=>exitArmed=false,2200);
      pushState();
    }
  });
  // Start with an app state, so in-app pages have a stable history anchor.
  history.replaceState(state(), '', location.pathname + location.search + location.hash);
  render();

  // Edge swipe opens the drawer; horizontal movement inside the drawer closes it.
  let sx=0,sy=0,tracking=false,wasOpen=false;
  document.addEventListener('touchstart',e=>{
    const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;wasOpen=drawerOpen;
    tracking=drawerOpen ? sx<300 : sx<28;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tracking)return;tracking=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dy)>Math.abs(dx)*.8)return;
    if(!wasOpen && dx>65){setDrawer(true);}
    else if(wasOpen && dx < -65 && sx<320){history.back();}
  },{passive:true});
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
